name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to publish the APK in Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CompleteEnglishGrammar.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompleteEnglishGrammar-apk
          path: CompleteEnglishGrammar.apk

      - name: Publish APK in Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug APK built automatically from commit ${{ github.sha }}.
          files: CompleteEnglishGrammar.apk
