name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to publish the APK in Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project folder
        id: find
        run: |
          G=$(find . -name gradlew -not -path "*/node_modules/*" | head -1)
          if [ -z "$G" ]; then
            echo "gradlew nahi mili. Repo ka structure:"; ls -R | head -50; exit 1
          fi
          DIR=$(dirname "$G")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$G"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" CompleteEnglishGrammar.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompleteEnglishGrammar-apk
          path: CompleteEnglishGrammar.apk

      - name: Publish APK in Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug APK built automatically from commit ${{ github.sha }}.
          files: CompleteEnglishGrammar.apk
