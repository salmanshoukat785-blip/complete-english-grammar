name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find or extract the project
        id: find
        run: |
          G=$(find . -name gradlew -not -path "./extracted/*" | head -1)
          if [ -z "$G" ]; then
            ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -1)
            if [ -z "$ZIP" ]; then
              echo "Na gradlew mili, na koi zip file"; ls -R | head -50; exit 1
            fi
            echo "Zip mili: $ZIP, extract ho rahi hai"
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            G=$(find extracted -name gradlew | head -1)
            if [ -z "$G" ]; then
              echo "Zip ke andar gradlew nahi hai"; exit 1
            fi
          fi
          DIR=$(dirname "$G")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$G"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" CompleteEnglishGrammar.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompleteEnglishGrammar-apk
          path: CompleteEnglishGrammar.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug APK built automatically.
          files: CompleteEnglishGrammar.apk
