name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract the newest ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then
            echo "No .zip file found in the repo root"; exit 1
          fi
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          GRADLEW=$(find extracted -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found inside the zip"; exit 1
          fi
          PROJECT=$(dirname "$GRADLEW")
          echo "Project folder: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          cd "$PROJECT"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" CompleteEnglishGrammar.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompleteEnglishGrammar-apk
          path: CompleteEnglishGrammar.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug APK built automatically from the zip in the repo.
          files: CompleteEnglishGrammar.apk
